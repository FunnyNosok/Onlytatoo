<!DOCTYPE html>
<html lang="ru">
<head><meta charset="UTF-8"><title>Проверка мобильной вёрстки</title>
<style>
  body { margin:0; background:#333; font:12px monospace; color:#fff; }
  .row { display:flex; flex-direction:column; align-items:center; gap:4px; padding:6px 0; }
  iframe { width:390px; height:844px; border:0; background:#000; }
  b { letter-spacing:.1em; }
</style>
</head>
<body>
<div class="row"><b id="l1"></b><iframe id="f1" src="/"></iframe></div>
<div class="row"><b>#works</b><iframe src="/#works"></iframe></div>
<div class="row"><b>#prices</b><iframe src="/#prices"></iframe></div>
<div class="row"><b>#booking</b><iframe src="/#booking"></iframe></div>
<div class="row"><b>#contacts</b><iframe src="/#contacts"></iframe></div>
<script>
  f1.addEventListener('load', function () {
    var w = f1.contentWindow;
    l1.textContent = 'hero — viewport внутри iframe: ' + w.innerWidth + ' x ' + w.innerHeight;
  });
</script>
</body>
</html>
